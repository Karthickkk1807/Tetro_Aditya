<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    <style>
        span {
            display: none;
            font-size: 20px;
            font-family: monospace;
            font-weight: 200;
        }

        input {
            border-radius: 10;
            border-color: black;
        }

        .row{
            display: flex;
            justify-content: center;
        }
        .card{
            width: 10;
            height: 190;
        }
        p{
            display: none;
        }
    
    </style>

</head>

<body>
    <div>
        <h3>ENTER YOUR NAME <input type="text" id="Kavi" required="text"><span>Focuse on the input box</span></h3>
        <h5><button>Submit</button></h5>
    </div>
    <div>
        <div class="row">
        <div class="card w-30 h-120 col-5">
            <div class="card-body">
              <h5 class="card-title">Card title</h5>
              <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
              <a href="#" class="btn btn-primary">Button</a>
            </div>
          </div>
          <div class="col-1"></div>
          <div class="card col-5">
            <div class="card-body">
              <h5 class="card-title">Card title</h5>
              <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
              <a href="#" class="btn btn-primary">Button</a>
            </div>
          </div>
        </div>
    </div>

    <script>
        //FOCUS 
        $(document).ready(function () {
            $("input").focus(function () {
                $(this).next("span").css("display", "inline").fadeOut(2000);
                $("button").click(function () {
                    alert("Input box focused!");
                });
            });
        });
        //SELECT AND TRIGGERHANDLER
        $(document).ready(function () {
            $("input").select(function () {
                alert("TEXT MARKED");
            });
            $("button").triggerHandler("select");
        });
        //SLIDE DOWN AND UP
        $(document).ready(function(){
            $("p").click(function(){
                $(".btn").slideToggle(3000);
            });
        });
    </script>
